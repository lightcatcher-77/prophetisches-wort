# Eigener Worker nur für die Reserve-Seite (eigene Webadresse, getrennt von der Hauptseite).
# Deploy: cd reserve && npx wrangler@4 deploy && npx wrangler@4 secret put NOTION_TOKEN
name = "prophetisches-wort-reserve"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

